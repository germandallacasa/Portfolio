<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>German Dallacasa | Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: white;
    }

    /* HERO */
    .hero {
      height: 100vh;
      background: url('cover.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Overlay oscuro suave */
    .overlay {
      background: rgba(0,0,0,0.35);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* HEADER */
    .header {
      padding: 40px 60px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .title {
      padding: 60px;
    }

    .name {
      font-size: 40px;
      letter-spacing: 4px;
      font-weight: 500;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 14px;
      color: #ddd;
    }

    .button {
      margin-top: 30px;
      display: inline-block;
      padding: 12px 20px;
      border: 1px solid white;
      text-decoration: none;
      color: white;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* SECTION PDF */
    .content {
      background: #f5f5f5;
      padding: 60px 20px;
    }

    iframe {
      width: 100%;
      max-width: 1000px;
      height: 90vh;
      display: block;
      margin: auto;
      border: none;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      background: white;
    }

  </style>
</head>

<body>

  <section class="hero">
    <div class="overlay">

      <div class="header">
        <div>GERMAN DALLACASA</div>
        <div>PORTFOLIO</div>
      </div>

      <div class="title">
        <div class="name">GERMAN DALLACASA</div>
        <div class="subtitle">Architect | Design & Planning</div>

        <a class="button" href="#portfolio">VIEW PORTFOLIO</a>
      </div>

    </div>
  </section>

  <section class="content" id="portfolio">
    <iframe src="portfolio.pdf"></iframe>
  </section>

</body>
</html>
